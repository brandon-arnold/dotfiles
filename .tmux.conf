unbind C-b
set -g prefix C-o
bind C-o send-prefix
set -g default-terminal "tmux-256color"

# Keep ~/scripts/tmux-claude-state in step with tmux: forget closed panes and pick
# up renames and moves straight away. It rebuilds the rest after a reboot.
set-hook -g pane-exited     'run-shell -b "~/scripts/tmux-claude-state sync"'
set-hook -g after-kill-pane 'run-shell -b "~/scripts/tmux-claude-state sync"'
set-hook -g window-unlinked 'run-shell -b "~/scripts/tmux-claude-state sync"'
set-hook -g window-linked   'run-shell -b "~/scripts/tmux-claude-state sync"'
set-hook -g session-closed  'run-shell -b "~/scripts/tmux-claude-state sync"'
set-hook -g session-renamed 'run-shell -b "~/scripts/tmux-claude-state sync"'
set-hook -g window-renamed  'run-shell -b "~/scripts/tmux-claude-state sync"'

# Wispr Flow (dictation) delivers text as a Ctrl+V paste chord. Shells treat
# Ctrl+V as quoted-insert, so in a shell pane turn it into a real paste of the
# Wayland clipboard; every other program (vim, claude, emacs) gets Ctrl+V as-is.
bind -n C-v if-shell -F '#{||:#{==:#{pane_current_command},zsh},#{==:#{pane_current_command},bash}}' \
    'run-shell "wl-paste -n | tmux load-buffer - && tmux paste-buffer -p"' \
    'send-keys C-v'
