unbind C-b
set -g prefix C-o
bind C-o send-prefix
set -g default-terminal "tmux-256color"

# Forget Claude panes that get closed (~/scripts/tmux-claude-state rebuilds the rest at login)
set-hook -g pane-exited     'run-shell -b "~/scripts/tmux-claude-state prune"'
set-hook -g after-kill-pane 'run-shell -b "~/scripts/tmux-claude-state prune"'
set-hook -g window-unlinked 'run-shell -b "~/scripts/tmux-claude-state prune"'
set-hook -g session-closed  'run-shell -b "~/scripts/tmux-claude-state prune"'
