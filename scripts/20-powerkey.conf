# Power button does nothing — hibernate/resume is broken on this machine
# (NVIDIA 5070 VRAM save-path), so a stray press was a hard data-loss event.
# Overrides HandlePowerKey=hibernate in the main logind.conf.
# NOTE: a ~4-10s hold is an EC/firmware hard cutoff and cannot be disabled here.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
