--ozone-platform=wayland
# NB: gtk-version is NOT the fix for the mono-UI bug -- BOTH GTK3 and GTK4 rendered
# the UI in mono. Real root cause (2026-07-27): the GTK/gsettings UI font was the
# variable font "Cantarell" (Cantarell-VF.otf), which Chrome's Skia renderer can't
# handle, so it fell back to Courier/Nimbus Mono. Native GTK apps (Pango) were fine.
# Fixed by switching the UI font to a STATIC font (Adwaita Sans) in gtk-3.0/gtk-4.0
# settings.ini + `gsettings ... interface font-name`. See secondbrain workstation.md.
# 2026-09-05: RE-ENABLED the GPU (this line commented out) because --disable-gpu
# forces WebGL software-only, and chrome://gpu showed WebGL "Disabled" outright --
# which broke vial.rocks (its web build needs a WebGL context; it died with
# "Cannot read properties of undefined (reading 'getParameter')").
# It was added 2026-05-29 as the settled workaround for the rAF frame-callback
# freeze (pages lock up until any keypress). IF THAT FREEZE COMES BACK, uncomment
# the line below. See project memory chrome-wayland-fw16.md.
#--disable-gpu
#--ignore-certificate-errors
#--disable-features=CalculateNativeWinOcclusion,WaylandFractionalScaleV1
#--disable-renderer-backgrounding
#--disable-backgrounding-occluded-windows
#--force-device-scale-factor=1.3
